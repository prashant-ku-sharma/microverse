name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths:
      [
        'apps/**',
        'packages/**',
        'deployment/**',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        'package.json',
        'tsconfig.base.json',
        '.github/workflows/deploy-pages.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build Host and real federation remotes for Pages
        run: pnpm build:pages '${{ steps.pages.outputs.base_url }}/' '1.${{ github.run_number }}.${{ github.run_attempt }}'
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Pages artifact before publication
        run: pnpm exec playwright test --config e2e/pages.config.ts
        env:
          PAGES_VERSION: 1.${{ github.run_number }}.${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deployment/.local/pages-1.${{ github.run_number }}.${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
